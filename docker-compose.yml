services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      #- prometheus_data:/prometheus
    networks:
      - telemetry-net
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - telemetry-net
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=amoc593@gmail.com
      - GF_SMTP_PASSWORD=gqwsogjbhgaetvag
      - GF_SMTP_FROM_ADDRESS=amoc593@gmail.com
      - GF_SMTP_FROM_NAME=Grafana_Monitoring
      - GF_SMTP_SKIP_VERIFY=true
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - telemetry-net

  seq:
    image: datalust/seq:latest
    ports:
      - "5342:80"
      - "5341:5341"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=Admin@123456
    networks:
      - telemetry-net
    volumes:
      - seq_data:/data
    restart: unless-stopped

networks:
  telemetry-net:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  seq_data:
    driver: local
