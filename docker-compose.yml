services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command:
      - "--config=/etc/otelcol/config.yaml"

    volumes:
      - ./otel-collector-config.yml:/etc/otelcol/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

    networks:
      - telemetry-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - telemetry-net
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - telemetry-net
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=amoc593@gmail.com
      - GF_SMTP_PASSWORD=gqwsogjbhgaetvag
      - GF_SMTP_FROM_ADDRESS=amoc593@gmail.com
      - GF_SMTP_FROM_NAME=Grafana_Monitoring
      - GF_SMTP_SKIP_VERIFY=true
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger

    environment:
      COLLECTOR_OTLP_ENABLED: "true"

    ports:
      - "16686:16686"

    networks:
      - telemetry-net

  seq:
    image: datalust/seq:latest
    container_name: seq
    ports:
      - "5342:80"
      - "5341:5341"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=Admin@123456
    networks:
      - telemetry-net
    volumes:
      - seq_data:/data
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001" # This maps the container port "3001" to the host port "3001"
    volumes:
      - uptime-kuma_data:/app/data # Configuring persistent storage
    environment:
      - TZ=UTC # Set the timezone (change to your preferred local timezone so
    networks:
      - telemetry-net
      
  # redis:
  #   image: redis:7-alpine
  #   container_name: redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"

networks:
  telemetry-net:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  seq_data:
    driver: local
  uptime-kuma_data:
    driver: local
