receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # 1. SEQ (HTTP OTLP for Logs and Traces)
  otlphttp/seq:
    endpoint: "http://seq:5341/ingest/otlp"
    tls:
      insecure: true
    # If Seq has API keys enabled, add headers:
    # headers:
    #   X-Seq-ApiKey: "YOUR_API_KEY"

  # 2. JAEGER (OTLP gRPC)
  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  # 3. PROMETHEUS (Exposes a pull endpoint for Prometheus)
  prometheus:
    endpoint: "0.0.0.0:8889"

    # Convert OTel resource attributes such as
    # service.name into Prometheus labels.
    resource_to_telemetry_conversion:
      enabled: true

  # Optional console debug output
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, otlphttp/seq]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/seq]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
