global:
  scrape_interval: 5s
scrape_configs:
  - job_name: "otel-collector"
    honor_labels: true
    scheme: http # Use HTTPS
    metrics_path: "/metrics"
    static_configs:
      - targets: ["otel-collector:8889"] # Replace with your target URL
    tls_config:
      insecure_skip_verify: true # Skips SSL cert verification (use with caution!)
